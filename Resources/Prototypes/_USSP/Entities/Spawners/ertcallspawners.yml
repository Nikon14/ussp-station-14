- type: entity
  id: SpawnERTLeaderEVAPreset
  name: ERT leader
  suffix: EVA
  parent: MarkerBase
  components:
    - type: GhostRole
      name: callert-leader-eva-name
      description: callert-leader-eva-desc
      rules: callert-leader-eva-rules
      raffle:
        settings: short
    - type: GhostRoleMobSpawner
      prototype: ERTLeaderEVAPreset
    - type: Sprite
      sprite: Markers/jobs.rsi
      layers:
        - state: green
        - sprite: Markers/jobs.rsi
          state: ertleadereva

