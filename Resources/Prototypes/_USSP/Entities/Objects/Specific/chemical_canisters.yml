- type: entity
  name: big canister
  parent: Jug
  id: USSPReagentCanister
  description: A big canister for a big boys.
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 600
  - type: Sprite
    sprite: _USSP/Objects/Specific/canister.rsi
    layers:
      - state: icon
      - state: fill-1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
  - type: Item
    size: BigReagentCanister   
    sprite: _USSP/Objects/Specific/canister.rsi
  - type: HeldSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: MultiHandedItem
  - type: Label
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
    inHandsMaxFillLevels: 3
    inHandsFillBaseName: -fill-
  - type: StaticPrice
    price: 180
  - type: Tag
    tags:
    - ChemDispensable
    
- type: entity
  parent: USSPReagentCanister
  name: canister (carbon)
  id: USSPReagentCanisterCarbon
  noSpawn: true
  components:
  - type: Label
    currentLabel: reagent-name-carbon
  - type: SolutionContainerManager
    solutions:
      beaker:
        reagents:
          - ReagentId: Carbon
            Quantity: 600

