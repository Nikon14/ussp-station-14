    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 1
  - type: Reflect
    reflects:
    - NonEnergy
    reflectProb: 0.3
    spread: 90
  - type: Item
    size: Ginormous
  - type: StaticPrice
