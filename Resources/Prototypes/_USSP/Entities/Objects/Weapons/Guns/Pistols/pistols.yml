- type: entity
  name: Глок 19
  parent: [BaseWeaponPistol, BaseSyndicateContraband]
  id: WeaponPistolGlock
  description: Дешевый и надежный пистолет, производится компанией Глок. Использует .35
  components:
  - type: Sprite
    sprite: _USSP/Objects/Weapons/Guns/Pistols/glock19.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    minAngle: 8
    maxAngle: 18
    shotsPerBurst: 5
    availableModes:
    - SemiAuto
