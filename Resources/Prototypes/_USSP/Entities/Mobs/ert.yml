- type: entity
  parent: MobHuman
  id: ERTLeaderEVAPreset
  name: ERT leader
  suffix: EVA
  components:
    - type: RandomMetadata
      nameSegments:
      - NamesMilitaryFirstLeader
      - NamesLast
      nameFormat: name-format-standard
    - type: Sprite
      netsync: false
      sprite: Markers/jobs.rsi
      state: ertleadereva
    - type: Loadout
      prototypes: [ ERTLeaderGearEVA ]
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: AutoImplant
      implants:
      - MindShieldImplant
    - type: GhostTakeoverAvailable
    - type: GhostRole
      name: callert-leader-eva-name
      description: callert-leader-eva-desc
      rules: callert-leader-eva-rules
      raffle:
        settings: short

