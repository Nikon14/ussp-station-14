- type: entity
  parent: MobHuman
  id: CBURNLeaderEVAPreset
  name: CBURN Agent
  components:
    - type: RandomMetadata
      nameSegments:
      - NamesMilitaryFirstLeader
      - NamesLast
      nameFormat: name-format-standard
    - type: Sprite
      netsync: false
      sprite: _USSP/Markers/Jobs/callert.rsi
      state: cburnleader
    - type: Loadout
      prototypes: [ CBURNGear ]
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: AutoImplant
      implants:
      - MindShieldImplant
    - type: GhostTakeoverAvailable
    - type: GhostRole
      name: callert-cburn-leader-eva-name
      description: callert-cburn-leader-eva-desc
      rules: callert-cburn-leader-eva-rules
      raffle:
        settings: short

